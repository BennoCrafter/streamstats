<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    color-scheme: light;
    --page:           #f9f9f7;
    --surface-1:      #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --series-1: #2a78d6; /* blue */
    --series-2: #eb6834; /* orange */
    --series-3: #1baf7a; /* aqua */
    --series-4: #eda100; /* yellow */
    --series-5: #e87ba4; /* magenta */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:           #0d0d0d;
      --surface-1:      #1a1a19;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); margin: 0 0 28px; font-size: 14px; }

  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .stat-tile .label { color: var(--text-secondary); font-size: 13px; }
  .stat-tile .value { font-size: 28px; font-weight: 600; margin-top: 4px; }
  .stat-tile .sublabel { color: var(--text-muted); font-size: 12px; margin-top: 2px; }

  .charts { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
  .charts .wide { grid-column: 1 / -1; }
  @media (max-width: 760px) { .charts { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; font-weight: 600; }
  .card .chart-wrap { position: relative; height: 260px; }
  .card .empty { color: var(--text-muted); font-size: 13px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; }
  .tabs a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 14px;
    padding: 7px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
  }
  .tabs a.active { color: var(--text-primary); background: var(--surface-1); font-weight: 600; }

  .range-filter { display: flex; gap: 6px; margin: 0 0 24px; }
  .range-filter a {
    color: var(--text-secondary);
    text-decoration: none;
    font-size: 13px;
    padding: 5px 12px;
    border-radius: 7px;
  }
  .range-filter a:hover { background: var(--surface-1); }
  .range-filter a.active { color: var(--text-primary); background: var(--surface-1); font-weight: 600; border: 1px solid var(--border); }

  .table-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .table-controls input[type="search"] {
    font: inherit;
    font-size: 13px;
    color: var(--text-primary);
    background: var(--page);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 10px;
    width: 220px;
  }
  .table-controls .count { color: var(--text-muted); font-size: 12px; }

  .table-wrap { max-height: 420px; overflow-y: auto; }
  table.watch-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .watch-table th {
    position: sticky; top: 0;
    background: var(--surface-1);
    text-align: left;
    color: var(--text-secondary);
    font-weight: 600;
    padding: 6px 10px;
    border-bottom: 1px solid var(--gridline);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .watch-table th .sort-arrow { color: var(--text-muted); }
  .watch-table td { padding: 6px 10px; border-bottom: 1px solid var(--gridline); }
  .watch-table th.num, .watch-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <nav class="tabs">
    <a href="/" class="{{ 'active' if active_key == 'all' }}">All services</a>
    {% for key, svc in services.items() %}
    <a href="/{{ key }}" class="{{ 'active' if key == active_key }}">{{ svc.name }}</a>
    {% endfor %}
  </nav>

  {% block content %}{% endblock %}
</main>

<script>
const style = getComputedStyle(document.documentElement);
const v = (name) => style.getPropertyValue(name).trim();
const seriesColors = [v('--series-1'), v('--series-2'), v('--series-3'), v('--series-4'), v('--series-5')];

Chart.defaults.font.family = "system-ui, -apple-system, 'Segoe UI', sans-serif";
Chart.defaults.color = v('--text-secondary');
Chart.defaults.borderColor = v('--gridline');

// Makes a <table id="tableId"> searchable (by its first column) and sortable (click any header).
function wireTable(tableId, searchId, countId) {
  const table = document.getElementById(tableId);
  const tbody = table.tBodies[0];
  const rows = Array.from(tbody.rows);
  const search = document.getElementById(searchId);
  const count = countId && document.getElementById(countId);

  function updateCount(visible) {
    if (count) count.textContent = `${visible} / ${rows.length}`;
  }
  updateCount(rows.length);

  if (search) {
    search.addEventListener('input', () => {
      const q = search.value.toLowerCase();
      let visible = 0;
      for (const row of rows) {
        const match = row.cells[0].textContent.toLowerCase().includes(q);
        row.style.display = match ? '' : 'none';
        if (match) visible++;
      }
      updateCount(visible);
    });
  }

  const headers = Array.from(table.tHead.rows[0].cells);
  let sort = { col: null, dir: 1 };
  headers.forEach((th, col) => {
    th.addEventListener('click', () => {
      sort = { col, dir: sort.col === col ? -sort.dir : 1 };
      const numeric = th.classList.contains('num');
      rows.sort((a, b) => {
        let av = a.cells[col].textContent.trim();
        let bv = b.cells[col].textContent.trim();
        if (numeric) { av = parseFloat(av) || 0; bv = parseFloat(bv) || 0; }
        return av < bv ? -sort.dir : av > bv ? sort.dir : 0;
      });
      rows.forEach((r) => tbody.appendChild(r));
      headers.forEach((h) => { const a = h.querySelector('.sort-arrow'); if (a) a.remove(); });
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = sort.dir === 1 ? ' ▲' : ' ▼';
      th.appendChild(arrow);
    });
  });
}

{% block script %}{% endblock %}
</script>
</body>
</html>
